version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: tnt-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tnt_supermarket
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tnt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Identity Service
  identity-service:
    build:
      context: ./backend
      dockerfile: ./infrastructure/Dockerfiles/Dockerfile.Identity
    container_name: tnt-identity-service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__IdentityDb: "Host=postgres;Port=5432;Database=tnt_supermarket;Username=postgres;Password=postgres;SSL Mode=Disable"
      Jwt__SecretKey: "your-super-secret-key-at-least-32-characters-long-for-jwt-signing"
      Jwt__Issuer: "TNT.IdentityService"
      Jwt__Audience: "TNT.Supermarket"
      Cors__AllowedOrigin: "http://localhost:5173"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tnt-network
    volumes:
      - ./backend:/app

  # User Service
  user-service:
    build:
      context: ./backend
      dockerfile: ./infrastructure/Dockerfiles/Dockerfile.User
    container_name: tnt-user-service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5001
      ConnectionStrings__UserDb: "Host=postgres;Port=5432;Database=tnt_supermarket;Username=postgres;Password=postgres;SSL Mode=Disable"
      Cors__AllowedOrigin: "http://localhost:5173"
    ports:
      - "5001:5001"
    depends_on:
      - postgres
      - identity-service
    networks:
      - tnt-network
    volumes:
      - ./backend:/app

  # Product Service
  product-service:
    build:
      context: ./backend
      dockerfile: ./infrastructure/Dockerfiles/Dockerfile.Product
    container_name: tnt-product-service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5002
      ConnectionStrings__ProductDb: "Host=postgres;Port=5432;Database=tnt_supermarket;Username=postgres;Password=postgres;SSL Mode=Disable"
      Cors__AllowedOrigin: "http://localhost:5173"
    ports:
      - "5002:5002"
    depends_on:
      - postgres
    networks:
      - tnt-network
    volumes:
      - ./backend:/app

  # Order Service
  order-service:
    build:
      context: ./backend
      dockerfile: ./infrastructure/Dockerfiles/Dockerfile.Order
    container_name: tnt-order-service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5003
      ConnectionStrings__OrderDb: "Host=postgres;Port=5432;Database=tnt_supermarket;Username=postgres;Password=postgres;SSL Mode=Disable"
      Cors__AllowedOrigin: "http://localhost:5173"
    ports:
      - "5003:5003"
    depends_on:
      - postgres
    networks:
      - tnt-network
    volumes:
      - ./backend:/app

  # Cart Service
  cart-service:
    build:
      context: ./backend
      dockerfile: ./infrastructure/Dockerfiles/Dockerfile.Cart
    container_name: tnt-cart-service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5004
      ConnectionStrings__CartDb: "Host=postgres;Port=5432;Database=tnt_supermarket;Username=postgres;Password=postgres;SSL Mode=Disable"
      Cors__AllowedOrigin: "http://localhost:5173"
    ports:
      - "5004:5004"
    depends_on:
      - postgres
    networks:
      - tnt-network
    volumes:
      - ./backend:/app

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tnt-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:5000
    depends_on:
      - identity-service
    networks:
      - tnt-network
    volumes:
      - ./frontend/src:/app/src

  # API Gateway (optional)
  # gateway:
  #   build:
  #     context: ./backend
  #     dockerfile: ./infrastructure/Dockerfiles/Dockerfile.Gateway
  #   container_name: tnt-gateway
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     - identity-service
  #     - user-service
  #     - product-service
  #     - order-service
  #   networks:
  #     - tnt-network

volumes:
  postgres_data:

networks:
  tnt-network:
    driver: bridge
