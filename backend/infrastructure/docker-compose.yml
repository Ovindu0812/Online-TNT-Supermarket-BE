version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# TNT Supermarket — Local Development Docker Compose
# Run: docker compose -f infrastructure/docker-compose.yml up -d
# Stop: docker compose -f infrastructure/docker-compose.yml down
# ─────────────────────────────────────────────────────────────────────────────

networks:
  tnt-network:
    driver: bridge

volumes:
  postgres-identity-data:
  postgres-user-data:
  kafka-data:

services:

  # ─── PostgreSQL — Identity Database ─────────────────────────────────────────
  postgres-identity:
    image: postgres:16-alpine
    container_name: tnt-postgres-identity
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tnt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_change_me}
      POSTGRES_DB: IdentityDb
    ports:
      - "5432:5432"
    volumes:
      - postgres-identity-data:/var/lib/postgresql/data
    networks:
      - tnt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tnt_user} -d IdentityDb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── PostgreSQL — User Database ──────────────────────────────────────────────
  postgres-user:
    image: postgres:16-alpine
    container_name: tnt-postgres-user
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tnt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_change_me}
      POSTGRES_DB: UserDb
    ports:
      - "5433:5432"
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    networks:
      - tnt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tnt_user} -d UserDb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Apache Kafka (KRaft mode — no ZooKeeper) ────────────────────────────────
  kafka:
    image: bitnami/kafka:3.7
    container_name: tnt-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      # KRaft mode (no ZooKeeper)
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_NUM_PARTITIONS: 1
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 1
      ALLOW_PLAINTEXT_LISTENER: "yes"
      BITNAMI_DEBUG: "false"
    volumes:
      - kafka-data:/bitnami/kafka
    networks:
      - tnt-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── Identity Service ─────────────────────────────────────────────────────────
  identity-service:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfiles/Dockerfile.Identity
    container_name: tnt-identity-service
    restart: unless-stopped
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__IdentityDb: "Host=postgres-identity;Port=5432;Database=IdentityDb;Username=${POSTGRES_USER:-tnt_user};Password=${POSTGRES_PASSWORD:-dev_password_change_me}"
      Jwt__Issuer: TNT.IdentityService
      Jwt__Audience: TNT.Supermarket
      Jwt__SecretKey: ${JWT_SECRET_KEY:-dev-only-secret-key-at-least-32-chars-long!}
      Jwt__AccessTokenMinutes: 15
      Jwt__RefreshTokenDays: 7
      Kafka__Enabled: "true"
      Kafka__BootstrapServers: kafka:9092
      Kafka__UserRegisteredTopic: user-events
      Kafka__ClientId: identity-service
      Cors__AllowedOrigin: "http://localhost:5173"
    depends_on:
      postgres-identity:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - tnt-network

  # ─── User Service ─────────────────────────────────────────────────────────────
  user-service:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfiles/Dockerfile.User
    container_name: tnt-user-service
    restart: unless-stopped
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__UserDb: "Host=postgres-user;Port=5432;Database=UserDb;Username=${POSTGRES_USER:-tnt_user};Password=${POSTGRES_PASSWORD:-dev_password_change_me}"
      Jwt__Issuer: TNT.IdentityService
      Jwt__Audience: TNT.Supermarket
      Jwt__SecretKey: ${JWT_SECRET_KEY:-dev-only-secret-key-at-least-32-chars-long!}
      Cors__AllowedOrigin: "http://localhost:5173"
    depends_on:
      postgres-user:
        condition: service_healthy
    networks:
      - tnt-network

  # ─── Notification Service ────────────────────────────────────────────────────
  notification-service:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfiles/Dockerfile.Notification
    container_name: tnt-notification-service
    restart: unless-stopped
    ports:
      - "5008:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Kafka__Enabled: "true"
      Kafka__BootstrapServers: kafka:9092
      Kafka__UserEventsTopic: user-events
      Kafka__ConsumerGroup: notification-service-group
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - tnt-network

  # ─── API Gateway ──────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfiles/Dockerfile.Gateway
    container_name: tnt-api-gateway
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ReverseProxy__Clusters__identity-cluster__Destinations__identity-destination__Address: http://identity-service:8080
      ReverseProxy__Clusters__user-cluster__Destinations__user-destination__Address: http://user-service:8080
      ReverseProxy__Clusters__notification-cluster__Destinations__notification-destination__Address: http://notification-service:8080
    depends_on:
      - identity-service
      - user-service
    networks:
      - tnt-network
